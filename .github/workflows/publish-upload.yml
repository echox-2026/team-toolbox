name: Publish upload

on:
  issues:
    types: [opened]

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[上传]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      result: ${{ steps.ingest.outputs.result }}
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: ingest
        run: node scripts/ingest-issue.mjs
      - if: steps.ingest.outputs.result == 'published'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/entries.json
          git commit -m "Publish upload from issue #$ISSUE"
          git push origin main
      - run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file ingest-note.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: ingest
    if: needs.ingest.outputs.result == 'published'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
